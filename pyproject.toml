[project]
name = "sat-interferometer-app"
version = "0.3.0"
description = "Interactive satellite RF interferometer and LEO emitter geolocation lab"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40,<2",
    "plotly>=5.24,<7",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
    "pyproj>=3.6,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
