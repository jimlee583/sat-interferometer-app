[project]
name = "sat-interferometer-app"
version = "0.1.0"
description = "Interactive narrowband satellite RF interferometer lab (versions 1 and 2)"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40,<2",
    "plotly>=5.24,<7",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]
